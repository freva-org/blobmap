name: Deploy Docs

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # mike commits to gh-pages, so it needs the full history
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        # mike is in the docs extra now, so it does not need naming here
        run: pip install -e ".[docs]"

      # On a pull request, prove the docs build and publish nothing. --strict
      # is what the deployed site is built with, so a broken cross-reference
      # fails on the PR rather than shipping silently.
      - name: Check docs build
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Configure git
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --alias-type=copy writes real files. mike defaults to a git symlink,
      # which GitHub Pages serves unreliably and which behaves differently
      # again if gh-pages is later served by nginx.
      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases --alias-type=copy dev

      - name: Deploy versioned docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases --alias-type=copy "$VERSION" latest
          mike set-default --push latest
