site_name: Blobmap
site_description: Decide which zarr objects move to tape together
repo_url: https://github.com/freva-org/blobmap
repo_name: freva-org/blobmap
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features: [navigation.sections, content.code.copy, toc.integrate]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest


nav:
  - Home: index.md
  - Design: design.md
  - Operations: operations.md
  - Internals: internals.md
  - Contributing: contributing.md
  - Reference:
      - model: reference/model.md
      - schema: reference/schema.md
      - partition: reference/partition.md
      - resolve: reference/resolve.md
      - hierarchy: reference/hierarchy.md
      - manifests: reference/manifests.md
      - storage: reference/storage.md
      - backends: reference/backends.md
      - service: reference/service.md
      - discover: reference/discover.md
      - cli: reference/cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
