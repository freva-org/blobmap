site_name: Blobmap
site_description: Decide which zarr objects move to tape together
site_url: https://freva-org.github.io/blobmap/
repo_url: https://github.com/freva-org/blobmap
repo_name: freva-org/blobmap
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest

extra:
  version:
    provider: mike
    alias: true

nav:
  - Home: index.md
  - Design: design.md
  - Operations: operations.md
  - Schema: schema.md
  - Internals: internals.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - Reference:
      - model: reference/model.md
      - schema: reference/schema.md
      - partition: reference/partition.md
      - resolve: reference/resolve.md
      - hierarchy: reference/hierarchy.md
      - manifests: reference/manifests.md
      - pins: reference/pins.md
      - report: reference/report.md
      - storage: reference/storage.md
      - backends: reference/backends.md
      - service: reference/service.md
      - discover: reference/discover.md
      - cli: reference/cli.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
