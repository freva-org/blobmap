# MinIO for the integration tests. The suite is the same one that runs
# against MemoryStore and LocalStore -- setting BLOBMAP_TEST_S3_URL just adds
# a third param to the `store` fixture.
#
#   docker compose up -d
#   export BLOBMAP_TEST_S3_URL=s3://blobmap-test
#   export BLOBMAP_TEST_S3_ENDPOINT=http://localhost:9000
#   export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin
#   export AWS_REGION=us-east-1
#   pytest -q
#
# Worth checking here rather than assuming: whether conditional PUT
# (If-None-Match / If-Match) behaves as it does on AWS. test_storage.py
# covers exactly that, so a MinIO run answers it.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_POSTGRES_ENABLE_primary: "on"
      MINIO_NOTIFY_POSTGRES_CONNECTION_STRING_primary: >-
        postgresql://blobmap:blobmap@postgres:5432/blobmap?sslmode=disable
      MINIO_NOTIFY_POSTGRES_TABLE_primary: minio_events
      # access, not namespace: an append-only log rather than one upserted
      # row per object key
      MINIO_NOTIFY_POSTGRES_FORMAT_primary: access
      MINIO_NOTIFY_POSTGRES_QUEUE_DIR_primary: /data/.events
      MINIO_NOTIFY_POSTGRES_QUEUE_LIMIT_primary: "100000"
    depends_on: [postgres]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blobmap
      POSTGRES_PASSWORD: blobmap
      POSTGRES_DB: blobmap
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blobmap"]
      interval: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/blobmap-test;
      mc mb --ignore-existing local/blobmap-manifests;
      mc event add local/blobmap-test arn:minio:sqs::primary:postgresql
        --event put,get || true;
      "
